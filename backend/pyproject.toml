[project]
name = "sanskriti-ai-studio-backend"
version = "0.1.0"
description = "Backend API for Sanskriti AI Studio"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    "sqlalchemy>=2.0.25",
    "alembic>=1.14.0",

    "psycopg[binary]>=3.2.0",

    "pydantic>=2.9.0",
    "pydantic-settings>=2.1.0",

    "python-dotenv>=1.0.1",

    "loguru>=0.7.2",

    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]